name: lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check userscript syntax
        run: node --check bilibili-danmaku-2state.user.js

      - name: Check console snippet syntax
        run: node --check bilibili-danmaku-2state.console.js
